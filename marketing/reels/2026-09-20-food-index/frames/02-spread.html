<style>
  .cmp { display: flex; flex-direction: column; gap: calc(22px * var(--u)); width: 100%; }
  .cmp .line { display: flex; align-items: baseline; gap: 20px; }
  .cmp .name { font-size: calc(36px * var(--u)); color: var(--text); font-weight: 500; }
  .cmp .rule { flex: 1; border-bottom: 1px dashed var(--border); }
  .cmp .val  { font-size: calc(46px * var(--u)); font-weight: 800;
               font-variant-numeric: tabular-nums; color: var(--text); }
  .cmp .up   { color: var(--text); }
  .cmp .down { color: var(--danger); }
  .hook { font-size: calc(112px * var(--u)); }
  .headline { font-size: calc(78px * var(--u)); }
  .body { font-size: calc(44px * var(--u)); max-width: 26ch; }
  /* Anchors the bottom of the frame. Without it the header holds the top and
     the lower third reads as unfinished rather than as deliberate space. */
  .foot { position: absolute; left: var(--pad); right: var(--pad);
          bottom: var(--pad); display: flex; align-items: center;
          justify-content: space-between;
          font-size: calc(30px * var(--u)); color: var(--text-muted);
          border-top: 1px solid var(--border); padding-top: calc(20px * var(--u)); }
  .foot .swipe { color: var(--mint); font-weight: 700; }
</style>
<style>

     composite on the dark canvas. Leaf runs taller than the wordmark, matching
     the brand lockup proportions. */

  .lockup .leafmark { height: calc(92px * var(--u)); width: auto; }

  .headline { font-size: calc(78px * var(--u)); }
  .body { font-size: calc(44px * var(--u)); max-width: 26ch; }
  /* Anchors the bottom of the frame. Without it the header holds the top and
     the lower third reads as unfinished rather than as deliberate space. */
  .foot { position: absolute; left: var(--pad); right: var(--pad);
          bottom: var(--pad); display: flex; align-items: center;
          justify-content: space-between;
          font-size: calc(30px * var(--u)); color: var(--text-muted);
          border-top: 1px solid var(--border); padding-top: calc(20px * var(--u)); }
  .foot .swipe { color: var(--mint); font-weight: 700; }
</style>
