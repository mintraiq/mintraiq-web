<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="app.css"></head><body><div class="frame">

  <div class="phone">

    <div class="screen">
      <div class="statusbar"><span>9:41</span><span style="letter-spacing:3px">&#9679;&#9679;&#9679; &#9650; &#9632;</span></div>
      <div class="appbody" style="padding:6px 30px 0">

               style="width:46px;height:46px;border-radius:11px">

        </div>

        <div style="position:relative;height:640px;border-radius:20px;overflow:hidden;
             background:#0A1220;border:1px solid #334155">
          <div style="position:absolute;inset:52px 74px;background:#F4F1E8;border-radius:6px;
               transform:rotate(-1.4deg);padding:26px 24px;
               font-family:ui-monospace,Menlo,monospace;font-size:17px;line-height:1.7;color:#3A3A38">

            <div style="text-align:center;font-size:14px;color:#77756E">24 SEP 2026</div>
            <div style="border-top:1px dashed #B9B5A8;margin:14px 0"></div>
            BANANAS 1.14KG<span style="float:right">4.56</span><br>
            BROCCOLI EA<span style="float:right">3.29</span><br>
            MILK STD 2L<span style="float:right">4.80</span><br>

            <div style="border-top:1px dashed #B9B5A8;margin:14px 0"></div>
            <span style="font-weight:700">TOTAL<span style="float:right">183.40</span></span>
          </div>
          <!-- corner brackets -->
          <div style="position:absolute;inset:30px;border-radius:12px"></div>
          <div style="position:absolute;top:30px;left:30px;width:78px;height:78px;
               border-top:6px solid #43D67A;border-left:6px solid #43D67A;border-radius:12px 0 0 0"></div>
          <div style="position:absolute;top:30px;right:30px;width:78px;height:78px;
               border-top:6px solid #43D67A;border-right:6px solid #43D67A;border-radius:0 12px 0 0"></div>
          <div style="position:absolute;bottom:30px;left:30px;width:78px;height:78px;
               border-bottom:6px solid #43D67A;border-left:6px solid #43D67A;border-radius:0 0 0 12px"></div>
          <div style="position:absolute;bottom:30px;right:30px;width:78px;height:78px;
               border-bottom:6px solid #43D67A;border-right:6px solid #43D67A;border-radius:0 0 12px 0"></div>
          <!-- scan sweep -->
          <div style="position:absolute;left:30px;right:30px;top:46%;height:4px;
               background:linear-gradient(90deg,transparent,#43D67A,transparent);
               box-shadow:0 0 34px 8px rgba(67,214,122,.5)"></div>
        </div>
        <div style="margin-top:26px;text-align:center;font-size:24px;color:#94A3B8">
