<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="/Users/ram/.claude/plugins/cache/mintraiq/mintraiq-toolkit/0.10.0/skills/marketing-reel/templates/frame.css">
<style>
  .lockup { display: flex; align-items: center; gap: calc(16px * var(--u)); }
  .lockup .leafmark { height: calc(92px * var(--u)); width: auto; }
  .lockup .word     { height: calc(44px * var(--u)); width: auto; }
  /* The figure is the image. At thumbnail size a number still reads; a
     sentence does not. */
  .hero { font-size: calc(360px * var(--u)); font-weight: 800; line-height: 0.86;
          letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
          color: var(--mint); margin: calc(14px * var(--u)) 0; }
  .over { font-size: calc(54px * var(--u)); font-weight: 700; color: var(--text);
          line-height: 1.15; max-width: 20ch; }
  .under { font-size: calc(40px * var(--u)); color: var(--text-muted);
           line-height: 1.4; margin-top: calc(22px * var(--u)); max-width: 24ch; }
  /* Anchors the bottom of the frame. Without it the header holds the top and
     the lower third reads as unfinished rather than as deliberate space. */
  .foot { position: absolute; left: var(--pad); right: var(--pad);
          bottom: var(--pad); display: flex; align-items: center;
          justify-content: space-between;
          font-size: calc(30px * var(--u)); color: var(--text-muted);
          border-top: 1px solid var(--border); padding-top: calc(20px * var(--u)); }
  .foot .swipe { color: var(--mint); font-weight: 700; }
</style>
<body class="frame feed glow is-centered">
  <div class="lockup">
    <img class="leafmark" src="/Users/ram/Desktop/Ram/mintraiq-web/assets/mintr-leaf-mark.png" alt="">
    <img class="word" src="/Users/ram/.claude/plugins/cache/mintraiq/mintraiq-toolkit/0.10.0/skills/marketing-reel/templates/assets/wordmark.png" alt="Mintr">
  </div>
  <span class="label">Stats NZ food price index</span>
  <p class="over">Food prices rose</p>
  <p class="hero">1.9%</p>
  <p class="under">In the year to August 2026.<br>Up 0.3% on July.</p>
  <div class="foot"><span>Stats NZ · August 2026</span><span class="swipe">Swipe →</span></div>
</body>
